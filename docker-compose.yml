# Dokploy deployment stack for Whots.
#
# Traefik (managed by Dokploy) terminates TLS and routes by path on the host
# whots.drreamer.digital:
#   /api, /health  ->  server:3001   (REST + WebSocket)
#   everything else -> web:3000      (SvelteKit / adapter-node)
#
# Only `web` and `server` join dokploy-network so Traefik can reach them; the
# database and cache stay on the private `internal` network. No host ports and
# no in-stack TLS — Dokploy owns 80/443.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: whots
      POSTGRES_USER: whots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whots -d whots"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./deploy/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://whots:${POSTGRES_PASSWORD}@postgres:5432/whots
      REDIS_URL: redis://redis:6379/
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY_SECONDS: ${JWT_ACCESS_EXPIRY_SECONDS:-900}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS:-30}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL}
      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RUST_LOG: ${RUST_LOG:-whots_server=info,tower_http=info}
    expose:
      - "3001"
    networks:
      - internal
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # adapter-node CSRF/origin check when running behind Traefik.
      ORIGIN: ${APP_URL}
      # Base URL the Node server uses to reach the API in-cluster (server-side
      # load/hooks); the browser uses same-origin /api via Traefik.
      INTERNAL_API_URL: http://server:3001
    expose:
      - "3000"
    networks:
      - internal
      - dokploy-network
    healthcheck:
      # Use 127.0.0.1 (not localhost): BusyBox resolves localhost to ::1 first,
      # but adapter-node binds IPv4 0.0.0.0 only. A failing healthcheck makes
      # Traefik's Docker provider hide the container, so the route 404s.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  internal:
  dokploy-network:
    external: true

volumes:
  pg_data:
  redis_data:
